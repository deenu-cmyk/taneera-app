<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Taneeraa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23C29D5E'/%3E%3Ctext x='50' y='69' font-size='60' text-anchor='middle' fill='white' font-family='serif' font-style='italic'%3ET%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8fafc}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:440px;background:#fff;padding:35px;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.1)}
.logo{text-align:center;color:#E42128;font-size:30px;font-weight:bold}.sub{text-align:center;color:#777}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:10px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;cursor:pointer;font-weight:bold}
#registerBtn{background:#E42128;color:#fff}#googleBtn{background:#fff;border:1px solid #ddd}
p{text-align:center}.link{color:#E42128;font-weight:bold;text-decoration:none}
.error{color:#E42128;font-size:13.5px;text-align:center;margin:6px 0 0}
.verify-panel{display:none;text-align:center}
.verify-icon{font-size:40px;margin-bottom:10px}
.verify-email{font-weight:bold;color:#132A63;margin:10px 0;word-break:break-all}
#resendBtn{background:#fff;border:1px solid #ddd;color:#132A63}
.resend-msg{font-size:13px;color:#22C55E;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<div class="logo" style="text-align:center;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:32px;font-weight:700;color:#3F4A38">Taneeraa</div>

<div id="formPanel">
  <h2>Create Account</h2><p class="sub">Join our handmade marketplace</p>
  <input type="text" id="name" placeholder="Full Name">
  <input type="email" id="email" placeholder="Email Address">
  <input type="password" id="password" placeholder="Password (min 8 characters)">
  <input type="password" id="confirmPassword" placeholder="Confirm Password">
  <p class="error" id="formError"></p>
  <button id="registerBtn">Create Account</button>
  <button id="googleBtn">🔵 Continue with Google</button>
  <p>Already have an account? <a class="link" href="login.html">Login</a></p>
</div>

<div id="verifyPanel" class="verify-panel">
  <div class="verify-icon">✅</div>
  <h2>Registration successful!</h2>
  <p class="sub">Please check your email and verify your email address before logging in.</p>
  <div class="verify-email" id="verifyEmailLabel"></div>
  <button id="openLoginBtn" style="background:#E42128;color:#fff">Open Login</button>
  <button id="resendBtn">Resend Verification Email</button>
  <p class="resend-msg" id="resendMsg">Verification email sent again. Please check your inbox.</p>
</div>

</div></div>
<script type="module">
import { registerUser, resendVerificationEmail, googleLogin } from "./auth.js";

let registeredEmail = "";
let registeredPassword = "";

document.getElementById("registerBtn").addEventListener("click", async () => {
  const errorEl = document.getElementById("formError");
  errorEl.textContent = "";

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirmPassword").value;

  if (!name) { errorEl.textContent = "Name is required."; return; }
  if (!email) { errorEl.textContent = "Email is required."; return; }
  if (!password || !confirm) { errorEl.textContent = "Please enter and confirm your password."; return; }
  if (password !== confirm) { errorEl.textContent = "Passwords do not match."; return; }
  if (password.length < 8) { errorEl.textContent = "Password must contain at least 8 characters."; return; }

  const btn = document.getElementById("registerBtn");
  btn.disabled = true;
  btn.textContent = "Creating account...";

  const result = await registerUser(name, email, password);

  btn.disabled = false;
  btn.textContent = "Create Account";

  if (!result.ok) {
    errorEl.textContent = result.message;
    return;
  }

  registeredEmail = email;
  registeredPassword = password;
  document.getElementById("verifyEmailLabel").textContent = email;
  document.getElementById("formPanel").style.display = "none";
  document.getElementById("verifyPanel").style.display = "block";
});

document.getElementById("googleBtn").addEventListener("click", googleLogin);

document.getElementById("openLoginBtn").addEventListener("click", () => {
  window.location.href = "login.html";
});

document.getElementById("resendBtn").addEventListener("click", async () => {
  const btn = document.getElementById("resendBtn");
  const msgEl = document.getElementById("resendMsg");
  btn.disabled = true;
  btn.textContent = "Sending...";
  msgEl.style.display = "none";

  const result = await resendVerificationEmail(registeredEmail, registeredPassword);

  btn.disabled = false;
  btn.textContent = "Resend Verification Email";

  if (result.ok) {
    msgEl.textContent = "Verification email sent again. Please check your inbox.";
    msgEl.style.color = "#22C55E";
    msgEl.style.display = "block";
  } else {
    msgEl.textContent = result.message;
    msgEl.style.color = "#E42128";
    msgEl.style.display = "block";
  }
});
</script>
</body>
</html>
