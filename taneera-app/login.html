<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Taneera's</title>
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8fafc}
.login-container{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.login-card{width:100%;max-width:420px;background:#fff;padding:35px;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.1)}
.logo{text-align:center;font-size:30px;font-weight:bold;color:#E42128;margin-bottom:10px}
h2{text-align:center;color:#132A63}.subtitle{text-align:center;color:#777;margin-bottom:25px}
input{width:100%;padding:14px;margin-bottom:15px;border:1px solid #ddd;border-radius:10px;font-size:15px}
.login-btn{width:100%;padding:14px;border:0;border-radius:10px;background:#E42128;color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
.google-btn{width:100%;padding:14px;margin-top:15px;border:1px solid #ddd;border-radius:10px;background:#fff;cursor:pointer;font-size:15px}
.forgot{display:block;text-align:right;margin-bottom:15px;color:#1F4FBF;cursor:pointer}
.register{text-align:center;margin-top:20px}.register a{color:#E42128;text-decoration:none;font-weight:bold}
.error{color:#E42128;font-size:13.5px;text-align:center;margin:-6px 0 12px}
.unverified-panel{display:none;text-align:center}
.unverified-icon{font-size:36px;margin-bottom:8px}
.unverified-panel p{color:#555;font-size:14px;margin:6px 0}
.unverified-panel .strong{color:#132A63;font-weight:bold}
#tryAgainBtn{background:#fff;border:1px solid #ddd;color:#132A63}
.resend-msg{font-size:13px;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="login-container">
<div class="login-card">
<div class="logo"><img src="assets/logo-full-trimmed.png" alt="Taneera's" style="width:150px;max-width:60%;margin:0 auto;display:block"></div>

<div id="formPanel">
  <h2>Welcome Back</h2>
  <p class="subtitle">Login to continue shopping handmade products</p>
  <input type="email" id="email" placeholder="Email Address">
  <input type="password" id="password" placeholder="Password">
  <p class="error" id="formError" style="display:none"></p>
  <span class="forgot" id="forgotPassword">Forgot Password?</span>
  <button class="login-btn" id="loginBtn">Login</button>
  <button class="google-btn" id="googleBtn">🔵 Continue with Google</button>
  <div class="register">Don't have an account? <a href="register.html">Create Account</a></div>
</div>

<div id="unverifiedPanel" class="unverified-panel">
  <div class="unverified-icon">✉️</div>
  <h2>Email Not Verified</h2>
  <p>Please verify your email address before logging in.</p>
  <p>Verification email has not been confirmed for:</p>
  <p class="strong" id="unverifiedEmailLabel"></p>
  <button class="login-btn" id="resendBtn" style="margin-top:16px">Resend Verification Email</button>
  <button id="tryAgainBtn" class="google-btn">Try Again</button>
  <p class="resend-msg" id="resendMsg"></p>
</div>

</div>
</div>
<script type="module">
import { loginUser, googleLogin, resetPassword, resendVerificationEmail } from "./auth.js";

let lastEmail = "";
let lastPassword = "";

document.getElementById("loginBtn").addEventListener("click", async () => {
  const errorEl = document.getElementById("formError");
  errorEl.style.display = "none";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) {
    errorEl.textContent = "Please enter email and password.";
    errorEl.style.display = "block";
    return;
  }

  lastEmail = email;
  lastPassword = password;

  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.textContent = "Signing in...";

  const result = await loginUser(email, password);

  btn.disabled = false;
  btn.textContent = "Login";

  if (result.ok) return; // loginUser() already redirected

  if (result.reason === "unverified") {
    document.getElementById("unverifiedEmailLabel").textContent = email;
    document.getElementById("resendMsg").style.display = "none";
    document.getElementById("formPanel").style.display = "none";
    document.getElementById("unverifiedPanel").style.display = "block";
  } else {
    errorEl.textContent = result.message;
    errorEl.style.display = "block";
  }
});

document.getElementById("googleBtn").addEventListener("click", googleLogin);

document.getElementById("forgotPassword").addEventListener("click", async () => {
  const email = document.getElementById("email").value.trim();
  if (!email) { alert("Please enter your email address first."); return; }
  await resetPassword(email);
});

document.getElementById("tryAgainBtn").addEventListener("click", () => {
  document.getElementById("unverifiedPanel").style.display = "none";
  document.getElementById("formPanel").style.display = "block";
});

document.getElementById("resendBtn").addEventListener("click", async () => {
  const btn = document.getElementById("resendBtn");
  const msgEl = document.getElementById("resendMsg");
  btn.disabled = true;
  btn.textContent = "Sending...";

  const result = await resendVerificationEmail(lastEmail, lastPassword);

  btn.disabled = false;
  btn.textContent = "Resend Verification Email";

  msgEl.style.display = "block";
  if (result.ok) {
    msgEl.textContent = "Verification email sent again. Please check your inbox.";
    msgEl.style.color = "#22C55E";
  } else {
    msgEl.textContent = result.message;
    msgEl.style.color = "#E42128";
  }
});
</script>
</body>
</html>
